name: Governance Gate
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      web: ${{ steps.plan.outputs.web }}
      mobile: ${{ steps.plan.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/governance/checks.py classify "$BASE_SHA" >> "$GITHUB_OUTPUT"
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify specifications
        run: npx --yes @fission-ai/openspec@1.10.0 validate --all --strict
      - name: Verify provenance and migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/governance/checks.py baseline "$BASE_SHA"
      - name: Verify registered patches
        run: scripts/governance/verify-upstream-modifications.sh committed
      - name: Governance regression tests
        run: python3 -m unittest discover -s scripts/governance -p 'test_*.py'
  backend:
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -f backend/pom.xml -pl crm -am test
  web:
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend --filter @cordys/web type:check
      - run: pnpm --dir frontend --filter @cordys/web build
  mobile:
    needs: classify
    if: needs.classify.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend --filter @cordys/mobile type:check
      - run: pnpm --dir frontend --filter @cordys/mobile build
  required:
    if: always()
    needs: [classify, policy, backend, web, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce planned checks
        env:
          PLAN_BACKEND: ${{ needs.classify.outputs.backend }}
          PLAN_WEB: ${{ needs.classify.outputs.web }}
          PLAN_MOBILE: ${{ needs.classify.outputs.mobile }}
          RESULT_CLASSIFY: ${{ needs.classify.result }}
          RESULT_POLICY: ${{ needs.policy.result }}
          RESULT_BACKEND: ${{ needs.backend.result }}
          RESULT_WEB: ${{ needs.web.result }}
          RESULT_MOBILE: ${{ needs.mobile.result }}
        run: python3 scripts/governance/checks.py aggregate
