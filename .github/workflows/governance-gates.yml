name: Governance Gate

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch declared upstream baseline for an upstream sync PR
        if: github.event_name == 'pull_request' && github.head_ref == 'upstream-sync'
        run: |
          set -euo pipefail
          . governance/upstream-baseline.env
          git remote add governance-upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url governance-upstream "$UPSTREAM_URL"
          git fetch --no-tags governance-upstream "$UPSTREAM_COMMIT"
      - name: Verify OpenSpec artifacts
        run: npx --yes @fission-ai/openspec@1.10.0 validate --all --strict
      - name: Verify upstream modification registration
        run: scripts/governance/verify-upstream-modifications.sh

  migration:
    name: migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify migration immutability and naming
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.head_ref }}" = "upstream-sync" ]; then
            . governance/upstream-baseline.env
            git remote add governance-upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url governance-upstream "$UPSTREAM_URL"
            git fetch --no-tags governance-upstream "$UPSTREAM_COMMIT"
            scripts/governance/verify-migrations.sh "$UPSTREAM_COMMIT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/governance/verify-migrations.sh "$BASE_SHA"
          else
            scripts/governance/verify-migrations.sh HEAD^
          fi

  backend-integration:
    name: backend-integration
    needs: [migration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Docker is available for Testcontainers
        run: docker info
      - name: Run Flyway and backend integration tests
        run: ./mvnw -f backend/pom.xml -pl crm -am test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Type-check and build web
        run: pnpm --dir frontend --filter @cordys/web build

  required:
    name: required
    if: always()
    needs: [policy, migration, backend-integration, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all governance jobs
        env:
          POLICY: ${{ needs.policy.result }}
          MIGRATION: ${{ needs.migration.result }}
          BACKEND: ${{ needs.backend-integration.result }}
          FRONTEND: ${{ needs.frontend-build.result }}
        run: |
          test "$POLICY" = success
          test "$MIGRATION" = success
          test "$BACKEND" = success
          test "$FRONTEND" = success
