name: Upstream Sync Gate
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Official ref or SHA for merge preview (not build or deployment approval)
        required: true
        default: main
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report merge feasibility and official migration impact
        env:
          CANDIDATE: ${{ inputs.upstream_ref }}
        run: scripts/governance/check-upstream-merge.sh "$CANDIDATE"
