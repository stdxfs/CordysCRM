name: Staging Preflight

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate commit SHA or release tag
        required: true
      image_digest:
        description: Immutable candidate image digest (sha256:...)
        required: true

permissions:
  contents: read

jobs:
  preflight:
    name: staging-preflight
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_CRM_URL: ${{ vars.STAGING_CRM_URL }}
      STAGING_SMOKE_USERNAME: ${{ secrets.STAGING_SMOKE_USERNAME }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - name: Verify required staging configuration
        run: |
          test -n "$STAGING_CRM_URL" || { echo 'Missing staging variable: STAGING_CRM_URL' >&2; exit 1; }
          test -n "$STAGING_SMOKE_USERNAME" || { echo 'Missing staging secret: STAGING_SMOKE_USERNAME' >&2; exit 1; }
          test -n "$STAGING_SMOKE_PASSWORD" || { echo 'Missing staging secret: STAGING_SMOKE_PASSWORD' >&2; exit 1; }
          [[ '${{ inputs.image_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'image_digest must be immutable sha256 digest' >&2; exit 1; }
      - name: Verify candidate endpoint is reachable
        run: curl --fail --show-error --silent --max-time 15 "$STAGING_CRM_URL/" >/dev/null
      - name: Record preflight scope
        run: |
          echo "Candidate ref: ${{ inputs.candidate_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: ${{ inputs.image_digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow performs no deployment, login, E2E test, database upgrade, or rollback.' >> "$GITHUB_STEP_SUMMARY"
